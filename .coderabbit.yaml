# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit PR 자동 리뷰 설정
# 정책과 검증 기록: docs/testing/step4-ci-coderabbit.md
#
# - CodeRabbit은 자동 리뷰만 한다. 승인·변경 요청 상태를 남기지 않고, main Ruleset의 필수 체크도 아니다.
# - 개발 원칙(Spring Boot 버전 호환 등)의 원문은 이후 AGENTS.md에 둔다. 이 파일에는 리뷰가 그 원칙과
#   어긋나지 않게 하는 최소 지시만 둔다. AGENTS.md·CLAUDE.md는 knowledge_base.code_guidelines 기본값으로 읽힌다.
language: ko-KR

reviews:
  profile: chill
  # 자동 승인·변경 요청(Request changes)을 하지 않는다.
  auto_approvals:
    enabled: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # 기본 브랜치(main)는 항상 리뷰한다. 다른 대상 브랜치는 리뷰하지 않는다.
    base_branches: []
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "backend/**/*.java"
      instructions: |
        Java 17, Spring Boot 4.1.3 멀티 모듈 백엔드다. 다음을 중심으로 검토한다.
        - 보안: 입력 검증, 인증·인가 누락, 비밀값·개인정보의 로그·응답 노출, SQL·경로 주입
        - 예외 처리: 예외를 삼키거나 원인을 잃는 처리, 너무 넓은 catch, 사용자에게 내부 정보를 노출하는 오류 응답
        - 테스트: 새 로직·분기·예외 경로에 테스트가 없는 경우
        - 버전 호환: 비즈니스 코드는 Spring Boot 3.5.x / Spring Framework 6.2.x와 호환되는 API를 우선 쓴다.
          Spring Boot 4 / Spring Framework 7 전용 API로 바꾸라고 제안하지 않고, 3.5 호환 API를 낡은 코드로 지적하지 않는다.
          (빌드 설정의 Boot 4 전용 스타터 이름·플러그인은 예외다.)
    - path: "backend/modules/**"
      instructions: |
        modules/<domain>은 도메인 모듈이다. 도메인 모듈끼리 서로 직접 의존하지 않는지,
        모듈 조립은 app 모듈에서만 하는지 확인한다.
    - path: "backend/**/*.gradle.kts"
      instructions: |
        저장소(repositories {})는 settings.gradle.kts에서만 선언한다(FAIL_ON_PROJECT_REPOS).
        라이브러리 버전은 Spring Boot BOM 또는 gradle/libs.versions.toml로만 관리하고 build 파일에 직접 적지 않는다.
        공통 규칙은 build-logic의 convention plugin에 둔다.
    - path: ".github/workflows/**"
      instructions: |
        permissions는 최소 권한(contents: read 기본)인지, 외부 Action은 커밋 SHA로 고정하고 태그 주석이 있는지,
        필수 체크(backend-build)가 paths 필터 등으로 건너뛰어지지 않는지 확인한다. CD·클라우드 자격 증명은 이 단계 범위가 아니다.
  tools:
    actionlint:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
