<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모바일 송출 POC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>모바일 송출 (카메라 + 마이크)</h1>
  <p class="lead"><a href="./">← 목록</a> · 순서: ① 카메라 권한 → ② 마이크 권한 → ③ 송출 시작 → ④ 송출 종료</p>

  <section>
    <h2>설정</h2>
    <div class="row">
      <label>스트림 이름 <input id="stream" type="text" value="mobile" size="10"></label>
      <label>카메라
        <select id="facing">
          <option value="user" selected>전면</option>
          <option value="environment">후면</option>
        </select>
      </label>
      <label>해상도
        <select id="resolution">
          <option value="640x480">640x480</option>
          <option value="1280x720" selected>1280x720</option>
          <option value="1920x1080">1920x1080</option>
        </select>
      </label>
      <label>비디오 코덱
        <select id="codec">
          <option value="video/H264" selected>H264</option>
          <option value="video/VP8">VP8</option>
          <option value="auto">브라우저 기본</option>
        </select>
      </label>
    </div>
  </section>

  <section>
    <div class="row">
      <button id="btnCam">① 카메라 켜기</button>
      <button id="btnMic" class="secondary">② 마이크 켜기</button>
      <button id="btnSwitch" class="secondary">전면/후면 전환</button>
      <label>마이크 음량 <meter id="meter" min="0" max="1" value="0"></meter></label>
    </div>
    <ul id="tracks" class="tracks"></ul>
  </section>

  <section>
    <div class="row">
      <button id="btnStart">③ 송출 시작</button>
      <button id="btnStop" class="danger" disabled>④ 송출 종료</button>
      <span>상태: <span id="status" class="status">대기</span></span>
    </div>
    <p class="hint">시청 주소: <a id="playLink" href="play.html?stream=mobile">play.html?stream=mobile</a></p>
    <video id="preview" autoplay muted playsinline></video>
  </section>

  <section>
    <h2>송출 통계</h2>
    <div id="stats" class="stats"></div>
  </section>

  <section>
    <h2>로그</h2>
    <div id="log" class="log"></div>
  </section>

  <section>
    <h2>이 브라우저의 지원 여부</h2>
    <div id="env"></div>
  </section>
</main>
<script type="module" src="js/publish-mobile.js"></script>
</body>
</html>
