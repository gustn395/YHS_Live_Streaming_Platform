<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC 송출 POC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>PC 송출 (화면 공유 + 마이크)</h1>
  <p class="lead"><a href="./">← 목록</a> · 순서: ① 화면 선택 → ② 마이크 켜기(선택) → ③ 송출 시작 → ④ 송출 중단</p>

  <section>
    <h2>설정</h2>
    <div class="row">
      <label>스트림 이름 <input id="stream" type="text" value="pc" size="10"></label>
      <label>비디오 코덱
        <select id="codec">
          <option value="video/H264" selected>H264</option>
          <option value="video/VP8">VP8</option>
          <option value="auto">브라우저 기본</option>
        </select>
      </label>
      <label>최대 비트레이트
        <select id="bitrate">
          <option value="1500000">1.5 Mbps</option>
          <option value="2500000" selected>2.5 Mbps</option>
          <option value="4000000">4 Mbps</option>
        </select>
      </label>
      <label>화면 내용
        <select id="hint">
          <option value="detail" selected>문서·코드 (선명도 우선)</option>
          <option value="motion">영상·게임 (프레임 우선)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label><input id="wantDisplayAudio" type="checkbox" checked> 화면 오디오 요청</label>
    </div>
  </section>

  <section>
    <h2>① 화면 · ② 마이크</h2>
    <div class="row">
      <button id="btnDisplay">① 화면 선택</button>
      <button id="btnMic" class="secondary">② 마이크 켜기</button>
      <label>마이크 <select id="micSelect"><option value="">기본 장치</option></select></label>
    </div>
    <div class="row">
      <label>화면 오디오 볼륨 <input id="gainDisplay" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>마이크 볼륨 <input id="gainMic" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>송출 음량 <meter id="meter" min="0" max="1" value="0"></meter></label>
    </div>
    <ul id="tracks" class="tracks"></ul>
  </section>

  <section>
    <div class="row">
      <button id="btnStart">③ 송출 시작</button>
      <button id="btnStop" class="danger" disabled>④ 송출 중단</button>
      <span>상태: <span id="status" class="status">대기</span></span>
    </div>
    <p class="hint">시청 주소: <a id="playLink" href="play.html?stream=pc">play.html?stream=pc</a></p>
    <video id="preview" autoplay muted playsinline></video>
  </section>

  <section>
    <h2>송출 통계</h2>
    <div id="stats" class="stats"></div>
  </section>

  <section>
    <h2>로그</h2>
    <div id="log" class="log"></div>
  </section>

  <section>
    <h2>이 브라우저의 지원 여부</h2>
    <div id="env"></div>
  </section>
</main>
<script type="module" src="js/publish-pc.js"></script>
</body>
</html>
