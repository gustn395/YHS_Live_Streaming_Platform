# 백엔드 CI: 변경 감지 → (Backend 변경 시) 전체 Gradle 모듈 빌드·테스트, 테스트 리포트·WAR 업로드 → 최종 Gate
# 정책과 검증 기록: docs/testing/step4-ci-coderabbit.md(빌드·Artifact), docs/testing/fe02-ci-split.md(감지·Gate·Ruleset)
#
# - paths 필터를 두지 않는다. 항상 실행하고 감지 Job이 build 실행 여부를 정한다.
#   main Ruleset 필수 체크는 전환 절차(fe02-ci-split.md 5장)를 거쳐 backend-build에서 Gate Job(backend-ci)으로 바뀐다.
# - Action은 커밋 SHA로 고정하고 태그를 주석으로 남긴다. 출시 후 14일 이상 지난 안정 버전만 쓴다.
# - DB·Redis·MediaMTX 없이 동작한다. 서비스 컨테이너를 두지 않는다.
# - PR에서 온 값은 action 입력·env로만 넘기고 run 본문에 직접 넣지 않는다.
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소한다. main push는 취소하지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: backend-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      mode: ${{ steps.detect.outputs.mode }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout (full history for merge-base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          base-sha: deadbeefdeadbeefdeadbeefdeadbeefdeadbeef # L3-3 임시: 없는 SHA로 실제 git 실패 재현 — 원복 예정
          head-sha: ${{ github.event.pull_request.head.sha }}

  build:
    # Job 이름은 Step 4 이후 그대로 둔다(Ruleset 전환 전 보호와 복구 절차가 이 이름을 쓴다).
    name: backend-build
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # MIT 오픈소스 캐시. 기본값(enhanced)은 상용 라이브러리를 쓴다.
          cache-provider: basic
          # gradle-wrapper.jar 체크섬 검증 (기본값 true를 명시)
          validate-wrappers: true

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Upload test reports
        # 테스트가 실패해도 수집한다. 취소된 실행만 건너뛴다.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload executable WAR
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-war
          path: |
            backend/app/build/libs/*.war
            !backend/app/build/libs/*-plain.war
          retention-days: 7
          if-no-files-found: error

  gate:
    # 이 이름을 main Ruleset의 Required status check로 등록한다(전환 절차: fe02-ci-split.md 5장). 바꾸면 Ruleset도 함께 바꾼다.
    # always(): 감지·build가 실패·취소돼도 Gate가 실행돼 FAILED를 남긴다(건너뛴 체크는 통과로 취급되기 때문).
    name: backend-ci
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (.github only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Gate
        uses: ./.github/actions/ci-gate
        with:
          area: backend
          changes-result: ${{ needs.changes.result }}
          backend-target: ${{ needs.changes.outputs.backend }}
          frontend-target: ${{ needs.changes.outputs.frontend }}
          mode: ${{ needs.changes.outputs.mode }}
          reason: ${{ needs.changes.outputs.reason }}
          build-result: ${{ needs.build.result }}
