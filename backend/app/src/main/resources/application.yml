# 기본 설정
# - 외부 인프라(DB, Redis) 없이 실행된다. 연결 설정은 해당 모듈을 구현할 때 추가한다.
# - 환경마다 다른 값과 비밀값은 환경변수로 받는다: ${ENV_NAME:기본값}
#   비밀값(비밀번호, 토큰, 키)은 기본값을 두지 않고 이 파일에 적지 않는다.
spring:
  application:
    name: yhs-live-streaming-backend
  autoconfigure:
    # Boot 기본 계정(InMemoryUserDetailsManager + 생성 비밀번호 로그)을 만들지 않는다.
    # 인증은 global 보안 체인과 member 모듈이 맡는다(docs/policy.md G-D013).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # DB 접속 정보는 이 파일에 적지 않고 SPRING_DATASOURCE_URL·_USERNAME·_PASSWORD 환경변수로만 받는다(비밀값, G-D010).
  # 스키마의 원본은 각 모듈의 Flyway 마이그레이션(classpath:db/migration)이고 Hibernate는 검증만 한다.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Redis(로그인 세션·OTP·요청 제한, MB-D014~D019). 접속 정보는 SPRING_DATA_REDIS_HOST·_PORT·_PASSWORD·_SSL_ENABLED
  # 환경변수로 받는다(비밀번호 기본값 없음). 장애 시 인증 요청은 503(fail-closed, MB-D019).
  data:
    redis:
      timeout: ${MEMBER_REDIS_TIMEOUT:2s}
      connect-timeout: ${MEMBER_REDIS_CONNECT_TIMEOUT:1s}
  # OTP 메일 SMTP(MB-D016). SPRING_MAIL_HOST·_PORT·_USERNAME·_PASSWORD 환경변수로만 받는다(기본값 없음, 없으면 기동 실패).
  # 개발: Mailpit(인증·TLS 없음) → MEMBER_SMTP_AUTH=false, MEMBER_SMTP_STARTTLS=false
  # 운영: Gmail SMTP(smtp.gmail.com:587, 앱 비밀번호) → MEMBER_SMTP_AUTH=true, MEMBER_SMTP_STARTTLS=true(필수)
  # 두 값은 기본값이 없어 환경마다 반드시 정해야 한다. 타임아웃(ms)은 설정값이고 자동 재시도는 없다.
  mail:
    properties:
      "[mail.smtp.auth]": ${MEMBER_SMTP_AUTH}
      "[mail.smtp.starttls.enable]": ${MEMBER_SMTP_STARTTLS}
      "[mail.smtp.starttls.required]": ${MEMBER_SMTP_STARTTLS}
      "[mail.smtp.connectiontimeout]": ${MEMBER_SMTP_CONNECT_TIMEOUT_MS:3000}
      "[mail.smtp.timeout]": ${MEMBER_SMTP_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${MEMBER_SMTP_WRITE_TIMEOUT_MS:5000}

logging:
  level:
    # Hibernate가 DB 제약 위반 상세("Key (email)=(...)", "Failing row contains (...)")를 로그에 남기지 않게 한다.
    # 이 상세에는 이메일·비밀번호 해시 같은 개인정보가 들어 있다. 위반은 어댑터가 제약 이름만 남기고 처리한다(명세 5장 민감 정보 로깅 금지).
    # Hibernate 7은 SqlExceptionHelper의 SQL 오류 로그를 이 카테고리로 남긴다. 예외 자체는 그대로 전파된다.
    org.hibernate.orm.jdbc.error: OFF

# 비밀 키는 용도별로 분리하고 환경변수로만 받는다. 기본값이 없어 없으면 애플리케이션이 뜨지 않는다(MB-D007).
# - 비밀번호 pepper: MEMBER_PASSWORD_PEPPER_KEY(Base64 256bit)·MEMBER_PASSWORD_PEPPER_KEY_ID
# - Access Token(JWT HS256) 서명: AUTH_JWT_KEY(Base64 256bit)·AUTH_JWT_KEY_ID (MB-D012)
# - OTP HMAC: MEMBER_OTP_HMAC_KEY(Base64 256bit)·MEMBER_OTP_HMAC_KEY_ID (MB-D015)
# - OTP 메일 발신 주소: MEMBER_OTP_MAIL_FROM (MB-D016)
# 요청·로그인·OTP 제한 수치는 member.limits.*로 바꿀 수 있고 기본값이 정책 값이다(MB-D017, MB-D018, 가입 수치 MB-D027).
# - Google OIDC 로그인(MB-D023·D024): GOOGLE_CLIENT_ID·GOOGLE_CLIENT_SECRET·MEMBER_OAUTH_PUBLIC_BASE_URL(경로 없는 https 출처,
#   http는 localhost·127.0.0.1·[::1]만). 없거나 비어 있으면 기동에 실패한다. Redirect URI는 {MEMBER_OAUTH_PUBLIC_BASE_URL}/api/v1/auth/oauth2/code/google이다.

member:
  oauth:
    public-base-url: ${MEMBER_OAUTH_PUBLIC_BASE_URL}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}

server:
  port: ${BACKEND_PORT:8080}

# API 문서(springdoc): 운영 기본값은 꺼짐(G-D008). 개발·테스트 환경에서 SPRINGDOC_ENABLED=true로 켠다.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        # 상태 확인용 health만 웹에 노출한다.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # health 확인마다 SMTP 서버(운영: Gmail)에 접속하지 않는다. SMTP 장애는 로그인 503(MEMBER_OTP_DELIVERY_UNAVAILABLE)으로 드러난다.
      enabled: false
