# 버전 카탈로그: 고정 버전을 이 파일 한 곳에서 관리한다.
# 개별 라이브러리 버전은 가능하면 Spring Boot BOM(spring-boot-dependencies)에 맡기고 여기 적지 않는다.
# BOM이 관리하지 않는 라이브러리(springdoc, MyBatis starter 등)를 도입할 때만 [versions]에 추가한다.

[versions]
# Spring Boot 4.1.x: OSS 지원 ~2027-07-31 (README "버전과 지원 기간" 참고)
spring-boot = "4.1.3"
# springdoc은 Boot와 같은 마이너 버전으로 빌드된 릴리스를 쓴다: 3.1.1 = Boot 4.1.0으로 빌드(POM 부모).
# 3.2.x는 Boot 4.2로 빌드돼 4.2 모듈을 끌어오고, 2.x는 Boot 3용이다. (docs/policy.md G-D008, G-D012)
springdoc = "3.1.1"
# ArchUnit: 모듈 경계 검사(테스트 전용, docs/policy.md G-D015). Spring BOM이 관리하지 않는다.
archunit = "1.5.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
